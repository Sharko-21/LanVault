name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: python tooling/validate-project.py
      - run: python tooling/check-public-files.py
      - run: pnpm check
      - run: python tooling/install-security-tools.py
      - run: .tools/security/actionlint -shellcheck= -pyflakes=
      - run: .tools/security/gitleaks git --redact --no-banner --log-level warn
      - run: pnpm audit --audit-level=moderate
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: cargo fmt --all --check
      - run: cargo test --locked -p lanvault-domain -p lanvault-protocol -p lanvault-storage -p lanvault-platform-windows -p lanvault-database -p lanvault-server
      - run: cargo clippy --release --locked --workspace --all-targets --features lanvault-desktop/custom-protocol -- -D warnings
      - run: cargo build --release --locked -p lanvault-server -p lanvault-desktop --features lanvault-desktop/custom-protocol
      - run: python tooling/test-server.py --exe target/release/lanvaultd.exe
      - run: python tooling/test-upload-lifecycle.py --exe target/release/lanvaultd.exe
      - name: Android build and real Windows interop
        shell: pwsh
        run: |
          $server = (Resolve-Path target/release/lanvaultd.exe).Path
          ./android/gradlew.bat -p android --no-daemon "-PlanvaultServerExe=$server" :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug :app:lintRelease testDebugUnitTest :core:model:test :core:transport:test
      - name: Audit shipped dependency graph
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts -Force | Out-Null
          cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc --features lanvault-desktop/custom-protocol > artifacts/cargo-windows.json
          ./android/gradlew.bat -p android --no-daemon --console=plain :app:dependencies --configuration releaseRuntimeClasspath > artifacts/android-dependencies.log
          python tooling/audit-dependencies.py --cargo-metadata artifacts/cargo-windows.json --gradle-report artifacts/android-dependencies.log --output artifacts/dependency-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-and-android-checks
          path: |
            artifacts/*.json
            android/**/build/reports/
          retention-days: 14
  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Enable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: bash android/gradlew -p android --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-api-${{ matrix.api }}-reports
          path: android/app/build/reports/androidTests/
          retention-days: 14
