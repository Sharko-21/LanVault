name: Release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: python tooling/check-public-files.py
      - run: python tooling/install-security-tools.py
      - run: .tools/security/gitleaks.exe git --redact --no-banner --log-level warn
      - run: cargo fmt --all --check
      - run: cargo test --locked -p lanvault-domain -p lanvault-protocol -p lanvault-storage -p lanvault-platform-windows -p lanvault-database -p lanvault-server
      - run: cargo clippy --release --locked --workspace --all-targets --features lanvault-desktop/custom-protocol -- -D warnings
      - run: cargo build --release --locked -p lanvault-server -p lanvault-desktop --features lanvault-desktop/custom-protocol
      - run: python tooling/test-server.py --exe target/release/lanvaultd.exe
      - run: python tooling/test-upload-lifecycle.py --exe target/release/lanvaultd.exe
      - name: Build and test Android release
        shell: pwsh
        run: |
          $server = (Resolve-Path target/release/lanvaultd.exe).Path
          ./android/gradlew.bat -p android --no-daemon "-PlanvaultServerExe=$server" :app:assembleRelease :app:lintRelease testDebugUnitTest :core:model:test :core:transport:test
      - name: Audit dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/release -Force | Out-Null
          cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc --features lanvault-desktop/custom-protocol > artifacts/cargo-windows.json
          ./android/gradlew.bat -p android --no-daemon --console=plain :app:dependencies --configuration releaseRuntimeClasspath > artifacts/android-dependencies.log
          python tooling/audit-dependencies.py --cargo-metadata artifacts/cargo-windows.json --gradle-report artifacts/android-dependencies.log --output artifacts/release/dependency-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency advisory check failed' }
          pnpm audit --audit-level=moderate
      - name: Sign Android and verify upgrade history
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LANVAULT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LANVAULT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if (!$env:ANDROID_KEYSTORE_BASE64 -or !$env:LANVAULT_KEYSTORE_PASSWORD) { throw 'Configure the permanent Android signing secrets before releasing.' }
          $store = Join-Path $env:RUNNER_TEMP 'lanvault-release.p12'
          try {
            [IO.File]::WriteAllBytes($store, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            if ($version -notmatch '^[0-9][0-9A-Za-z.+-]*$') { throw 'Invalid release version' }
            ./tooling/sign-android.ps1 -UnsignedApk android/app/build/outputs/apk/release/app-release-unsigned.apk -OutputApk "artifacts/release/LanVault-$version-android.apk" -KeyStore $store -Lineage android/signing/lineage.bin
            $signer = (Get-Content android/signing/signing-policy.json -Raw | ConvertFrom-Json).releaseSignerSha256
            & "$env:JAVA_HOME/bin/java.exe" --class-path "$env:ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" tooling/CheckApk.java "artifacts/release/LanVault-$version-android.apk" $signer android/signing/previous-certificate.der
            if ($LASTEXITCODE -ne 0) { throw 'APK upgrade verification failed' }
          } finally { Remove-Item -LiteralPath $store -ErrorAction SilentlyContinue }
      - name: Optional Windows Authenticode
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'lanvault-authenticode.pfx'
            try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
              $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $certificate = Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation Cert:/CurrentUser/My
              $signTool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" | Sort-Object FullName | Select-Object -Last 1
              ./tooling/sign-windows.ps1 -Executable target/release/lanvault-desktop.exe -CertificateThumbprint $certificate.Thumbprint -SignTool $signTool.FullName
            } finally {
              Remove-Item -LiteralPath $pfx -ErrorAction SilentlyContinue
              if ($certificate) { Remove-Item -LiteralPath "Cert:/CurrentUser/My/$($certificate.Thumbprint)" }
            }
          } else { Write-Output 'Building explicitly unsigned Windows beta.' }
      - name: Package exact source and verify distributions
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          python tooling/package-beta.py --output artifacts/release --windows-directory target/release --android-apk "artifacts/release/LanVault-$version-android.apk" > artifacts/package-result.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          $snapshot = (Get-Content artifacts/package-result.json | Select-Object -Last 1 | ConvertFrom-Json).sourceSnapshot
          .tools/security/gitleaks.exe dir $snapshot --redact --no-banner --log-level warn
          if ($LASTEXITCODE -ne 0) { throw 'Source secret scan failed' }
          python tooling/verify-beta.py artifacts/release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution validation failed' }
          @{ version = $version; sourceCommit = $env:GITHUB_SHA; windowsSignature = (Get-AuthenticodeSignature target/release/lanvault-desktop.exe).Status.ToString() } | ConvertTo-Json | Set-Content artifacts/release/release-manifest.json -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-release-candidate
          path: |
            artifacts/release/*.apk
            artifacts/release/*.zip
            artifacts/release/*.txt
            artifacts/release/*.json
          retention-days: 30
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: beta-release-candidate
          path: candidate
      - name: Create draft prerelease for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          [[ "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || exit 1
          gh release create "v$version" --draft --prerelease --target "$GITHUB_SHA" --title "LanVault $version" --notes-file "docs/releases/$version.md" candidate/*.apk candidate/*.zip candidate/*.txt candidate/*.json
