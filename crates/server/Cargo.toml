[package]
name = "lanvault-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "lanvaultd"
path = "src/main.rs"

[dependencies]
lanvault-domain.workspace = true
lanvault-protocol.workspace = true
lanvault-storage.workspace = true
lanvault-platform-windows.workspace = true
lanvault-database.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tokio.workspace = true
sha2.workspace = true
chrono.workspace = true
base64.workspace = true
axum = { version = "=0.8.9", features = ["json", "tokio", "http1"], default-features = false }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = { version = "=0.14.10", features = ["pem", "crypto", "ring"], default-features = false }
getrandom = "=0.4.3"
tokio-util = { version = "=0.7.20", features = ["rt"] }
futures-util = "0.3"
zeroize = "1"
time = "0.3"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
mdns-sd = "=0.21.7"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
